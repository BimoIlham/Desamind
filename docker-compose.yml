# =====================================================================
# DesaMind — Docker Compose
# Jalankan:  docker compose up -d --build
# Akses   :  http://localhost:3000
# =====================================================================
services:
  desamind:
    build:
      context: .
      dockerfile: Dockerfile
    image: desamind:latest
    container_name: desamind
    ports:
      - "3000:3000"
    # Semua variabel (Supabase, Gemini, dll) dibaca dari .env.local saat
    # container berjalan. Di aplikasi ini Supabase hanya dipakai sisi server,
    # jadi cukup runtime env — tidak perlu build arg.
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
