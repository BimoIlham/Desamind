# =====================================================================
# DesaMind - Docker Compose
# Jalankan:  docker compose up -d --build
# Akses   :  http://localhost:3000
# =====================================================================
services:
  desamind:
    build:
      context: .
      dockerfile: Dockerfile
    image: desamind:latest
    container_name: desamind
    ports:
      - "3000:3000"
    restart: unless-stopped
